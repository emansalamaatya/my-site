<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة البحث عن الهوية الوطنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== شاشة البداية ========== -->
<section id="screen-start" class="screen active">
  <div class="hero">
    <img src="assets/board/banner-top.jpg" alt="رحلة البحث عن الهوية الوطنية" class="hero-img">
  </div>
  <div class="start-card">
    <h1>رحلة البحث عن الهوية الوطنية</h1>
    <p class="tag">تعلّم .. تحدَّ .. انتمِ</p>

    <h2 class="sub">اختاري نظام اللعب</h2>
    <div class="modes">
      <button class="mode" data-mode="solo">
        <span class="ico">🧑‍🤝‍🧑</span>
        <b>منافسة فردية</b>
        <small>طالب ضد طالب على جهاز واحد</small>
      </button>
      <button class="mode" data-mode="team">
        <span class="ico">👥</span>
        <b>منافسة جماعية</b>
        <small>فريق ضد فريق</small>
      </button>
      <button class="mode disabled" data-mode="remote" disabled>
        <span class="ico">🌐</span>
        <b>عن بُعد</b>
        <small>قريبًا (المرحلة السادسة)</small>
      </button>
    </div>
    <button id="btn-resume" class="btn ghost hidden">↩ متابعة المباراة السابقة</button>
  </div>
</section>

<!-- ========== إعداد اللاعبين ========== -->
<section id="screen-setup" class="screen">
  <div class="start-card">
    <h2 id="setup-title">إعداد المباراة</h2>
    <div id="setup-fields"></div>
    <div class="row">
      <button id="btn-add" class="btn ghost">＋ إضافة</button>
      <button id="btn-remove" class="btn ghost">－ حذف</button>
    </div>
    <div class="row">
      <button id="btn-back-start" class="btn ghost">رجوع</button>
      <button id="btn-go" class="btn primary">ابدأ الرحلة 🚀</button>
    </div>
  </div>
</section>

<!-- ========== اللعبة ========== -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <button id="btn-menu" class="icon-btn" title="القائمة">☰</button>
    <div id="turn-banner" class="turn"></div>
    <div class="zoom">
      <button id="zoom-out" class="icon-btn" title="تصغير">－</button>
      <button id="zoom-in" class="icon-btn" title="تكبير">＋</button>
    </div>
  </header>

  <div id="scoreboard" class="scoreboard"></div>

  <div id="board-scroll" class="board-scroll">
    <div id="board" class="board">
      <img src="assets/board/board-original.jpg" alt="لوحة اللعبة" class="board-img" draggable="false">
      <div id="tokens"></div>
    </div>
  </div>

  <footer class="dock">
    <div id="msg" class="msg">اضغط على النرد لتبدأ!</div>
    <button id="dice" class="dice" aria-label="ارمِ النرد">
      <div class="cube" id="cube"></div>
    </button>
  </footer>
</section>

<!-- ========== نافذة عامة ========== -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div id="modal-body"></div>
    <div id="modal-actions" class="row"></div>
  </div>
</div>

<!-- ========== طبقة الكروت ========== -->
<div id="card-layer" class="card-layer hidden"><div id="card-body" class="card-body"></div></div>

<!-- ========== شاشة الفوز ========== -->
<section id="screen-win" class="screen win">
  <canvas id="confetti"></canvas>
  <div class="win-box">
    <img src="assets/badge/badge-600.png" alt="وسام سفير الهوية الوطنية" class="badge">
    <h2 id="win-name"></h2>
    <p class="congrats">مبروك.. أنت سفير الهوية الوطنية</p>
    <div id="win-scores" class="win-scores"></div>
    <div class="row">
      <button id="btn-save-cert" class="btn ghost">💾 حفظ صورة التكريم</button>
      <button id="btn-again" class="btn primary">لعبة جديدة</button>
    </div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/fx.js"></script>
<script src="js/draw.js"></script>
<script src="js/cards-data.js"></script>
<script src="js/game.js"></script>
<script src="js/cardui.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
